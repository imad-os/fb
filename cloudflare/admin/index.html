<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stream Lists</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='13' rx='2' fill='%237c6cff'/%3E%3Cpath d='M10 8l5 2.5-5 2.5z' fill='white'/%3E%3C/svg%3E">
<script src="config.js"></script>
<style>
:root {
  --bg: #0d1117; --side: #11161e; --panel: #161c26; --panel-2: #1d2532; --hover: #222b3a; --line: #263041;
  --text: #e8edf4; --text-2: #9aa7b8; --text-3: #6b7889; --accent: #7c6cff; --accent-2: #9a8cff;
  --ok: #2fbf71; --warn: #f0a33a; --err: #f0525a; --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent-2); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; background: var(--accent); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
button:hover { filter: brightness(1.1); }
button:disabled { opacity: .5; cursor: default; filter: none; }
button.ghost { background: var(--panel-2); border-color: var(--line); color: var(--text); font-weight: 500; }
button.ghost:hover { background: var(--hover); }
button.danger { background: transparent; border-color: rgba(240,82,90,.4); color: var(--err); }
button.danger:hover { background: rgba(240,82,90,.12); }
button.icon { padding: 6px; background: transparent; color: var(--text-2); }
button.icon:hover { background: var(--hover); color: var(--text); }
button.small { padding: 5px 10px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(124,108,255,.18); }
input[type=checkbox] { width: auto; accent-color: var(--accent); }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 5px; }
.field { margin-bottom: 14px; }
.row { display: flex; gap: 12px; align-items: center; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
[hidden] { display: none !important; }

/* login */
#login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
.login-card h1 { margin: 14px 0 4px; font-size: 20px; }
.logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; color: #fff; }
.logo svg.i { width: 24px; height: 24px; }

/* shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.tbl { overflow-x: auto; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; gap: 14px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand .logo { width: 34px; height: 34px; border-radius: 9px; }
.brand b { display: block; font-size: 14.5px; } .brand span { font-size: 12px; color: var(--text-3); }
.list-pick label { padding: 0 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; margin-bottom: 2px; border-radius: 8px; color: var(--text-2); position: relative; }
.nav a:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.nav a.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
.nav a.on::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--text-3); }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; }
.side-foot .who { display: block; font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px; }
main { min-width: 0; padding: 26px 32px 60px; }
.head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 22px; } .head p { margin: 3px 0 0; color: var(--text-2); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 12px; font-size: 15px; }
.card.flush { padding: 0; overflow: hidden; }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--radius); background: rgba(240,163,58,.1); border: 1px solid rgba(240,163,58,.35); margin-bottom: 16px; flex-wrap: wrap; }
.banner.err { background: rgba(240,82,90,.1); border-color: rgba(240,82,90,.35); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.toolbar input, .toolbar select { width: auto; min-width: 160px; }
.toolbar input[type=search] { flex: 1; min-width: 180px; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.tabs button { background: transparent; color: var(--text-2); font-weight: 500; padding: 6px 12px; }
.tabs button.on { background: var(--panel-2); color: var(--text); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255,255,255,.015); }
td.num, th.num { text-align: right; } td.act { text-align: right; white-space: nowrap; }
td .name { font-weight: 600; } td .sub { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
.thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--panel-2); display: block; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--panel-2); color: var(--text-2); }
.badge.ok { background: rgba(47,191,113,.14); color: var(--ok); }
.badge.err { background: rgba(240,82,90,.14); color: var(--err); }
.badge.warn { background: rgba(240,163,58,.14); color: var(--warn); }
.badge.acc { background: rgba(124,108,255,.16); color: var(--accent-2); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.empty { padding: 48px 16px; text-align: center; color: var(--text-3); }
.more { padding: 12px; text-align: center; border-top: 1px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile b { display: block; font-size: 24px; } .tile span { color: var(--text-2); font-size: 12.5px; }
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.list-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.list-card.on { border-color: var(--accent); }
.list-card h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.list-card .stats { display: flex; gap: 14px; color: var(--text-2); font-size: 12.5px; flex-wrap: wrap; }
.copy { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 10px; margin-bottom: 10px; }
.copy code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.copy-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 5px; }
pre.share { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; margin: 0 0 10px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.checks label:has(input:checked) { border-color: var(--accent); background: rgba(124,108,255,.08); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
tr.off td:not(.act) { opacity: .5; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: 1px; flex: none; }
.dot.up { background: var(--ok); } .dot.down { background: var(--err); } .dot.na { background: var(--warn); }
.check-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 14px; }
.check-stats div { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.check-stats b { display: block; font-size: 22px; }
.progress { height: 6px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.dlg-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dlg-head h3 { margin: 0; font-size: 16px; flex: 1; }
.dlg-body { padding: 18px 20px; overflow: auto; }
.dlg-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dlg-foot .left { margin-right: auto; }

/* toasts */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; min-width: 240px; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: rise .2s ease-out; }
.toast.ok { border-left-color: var(--ok); } .toast.err { border-left-color: var(--err); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 10px; }
  .brand span { display: none; }
  .list-pick { flex: 1; min-width: 0; } .list-pick label { display: none; }
  .toolbar input, .toolbar select { min-width: 0; flex: 1 1 140px; }
  .toolbar .tabs { overflow-x: auto; max-width: 100%; }
  .nav { order: 5; width: 100%; display: flex; overflow-x: auto; gap: 2px; }
  .nav a { white-space: nowrap; padding: 8px 10px; } .nav a.on::before { display: none; }
  .side-foot { margin: 0; border: 0; padding: 0; } .side-foot .who { display: none; }
  main { padding: 18px 16px 48px; }
  .hide-sm { display: none; }
  td, th { padding: 8px 10px; }
}
</style>
</head>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="login-card" id="login-form">
    <div class="logo"><svg class="i"><use href="#i-tv"/></svg></div>
    <h1 id="login-title">Stream Lists</h1>

<!-- APP -->

<script>
"use strict";
// Talks to the Worker's /api (Cloudflare D1). No framework, no build step.
const DEFAULT_LIST = "default";
const TYPES = { live: "Live TV", vod: "Movies", series: "Series", episode: "Episodes" };
const ONE = { live: "channel", vod: "movie", series: "series", episode: "episode" };
const CAT_TYPES = { live: "Live TV", vod: "Movies", series: "Series" };
const PAGE = 200;

// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const nowSec = () => Math.floor(Date.now() / 1000);
const toast = (msg, kind = "") => {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg; el.setAttribute("role", kind === "err" ? "alert" : "status");
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), kind === "err" ? 6000 : 3000);
};
const fail = (e) => { console.error(e); toast(e.message || String(e), "err"); };
const slug = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const LIST_ID_RE = /^[a-z0-9][a-z0-9_-]{0,39}$/;
const fmtDate = (sec) => sec ? new Date(sec * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const randPass = () => { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for (const n of crypto.getRandomValues(new Uint32Array(10))) s += a[n % a.length]; return s; };
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
};
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast("Copied", "ok");
}

// ---------------------------------------------------------------- API
const API = {
  base() { return String(store.get("xa_api", window.IPTV_API || "")).replace(/\/+$/, ""); },
  token() { return store.get("xa_token", ""); },
  async call(method, path, data) {
    let r;
    try {
      r = await fetch(API.base() + "/api/" + path, {
        method, headers: { "Content-Type": "application/json", ...(API.token() ? { Authorization: "Bearer " + API.token() } : {}) },
        body: data === undefined ? undefined : JSON.stringify(data)
      });
    } catch (e) { throw new Error("Cannot reach the server " + API.base()); }
    let body = null; try { body = await r.json(); } catch (e) {}
    if (r.status === 401 && path !== "login") { store.set("xa_token", null); showLogin(); }
    if (!r.ok) throw new Error((body && body.error) || ("Error " + r.status));
    return body;
  },
  get: (p) => API.call("GET", p), post: (p, d) => API.call("POST", p, d || {}), put: (p, d) => API.call("PUT", p, d || {}), del: (p) => API.call("DELETE", p)
};

  },
  async users(force) { if (!S.users || force) S.users = await API.get("users"); return S.users; },
  async cats(listId = S.list, force) {
    if (!S.cats[listId] || force) S.cats[listId] = await API.get("categories?list=" + encodeURIComponent(listId));
    return S.cats[listId];
  },
  async streams(type, listId = S.list, force) {

  },
  async settings() { S.settings = await API.get("settings"); },
  /** After a change in the current list: drop what changed and refresh the counts. */
  async changed(types) {

// ---------------------------------------------------------------- links
const Links = {
  base() { return String(S.settings.base_url || API.base()).replace(/\/+$/, ""); },
  // The default list is at the root (the standard Xtream address); other lists at /l/<list>.
  // A user with only one list can use the root for it too (players that take just a host).
  server(listId, u) {
    const mine = u ? userLists(u).filter((id) => S.lists.some((l) => l.id === id && l.enabled)) : [];
    if (listId === DEFAULT_LIST || (mine.length === 1 && mine[0] === listId)) return Links.base();
    return `${Links.base()}/l/${encodeURIComponent(listId)}`;
  },
  all(listId, u) {
    const s = Links.server(listId, u);
    const q = u ? `username=${encodeURIComponent(u.username)}&password=${encodeURIComponent(u.password)}` : "username=USER&password=PASS";
    return { server: s, api: `${s}/player_api.php?${q}`, m3u: `${s}/get.php?${q}&type=m3u_plus&output=ts`, m3u8: `${s}/get.php?${q}&type=m3u_plus&output=m3u8`, epg: `${s}/xmltv.php?${q}` };
  },
  share(listId, u) {
    const l = Links.all(listId, u); const list = S.lists.find((x) => x.id === listId) || { name: listId };
    const exp = u.exp_date ? fmtDate(u.exp_date) : "no end date";
    return `${list.name} – your TV access\n\nXtream Codes login (IPTV Smarters, TiviMate, Speedy...)\nServer: ${l.server}\nUsername: ${u.username}\nPassword: ${u.password}\n\nM3U playlist: ${l.m3u}\nEPG: ${l.epg}\n\nValid until: ${exp}`;
  },
  row(label, value) {
    return `<div class="copy-row"><p class="copy-label">${esc(label)}</p><div class="copy"><code title="${esc(value)}">${esc(value)}</code><button type="button" class="ghost small" data-copy="${esc(value)}">${icon("copy")}Copy</button></div></div>`;
  }
};

    const gen = ++Dlg.gen;

    const foot = $("#dlg-foot"); foot.innerHTML = "";
    (buttons || [{ label: "Close", cls: "ghost" }]).forEach((b) => {

      el.type = "button"; el.className = b.cls || ""; el.innerHTML = b.label;

      else {
        el.dataset.primary = "1";

    });

// ---- stream check (runs on the Worker: the browser only sends ids and gets small results back)
const ST_FILTERS = { "": "Any state", down: "Down", up: "Working", na: "Cannot check", never: "Not checked", off: "Turned off" };
function stMatch(s) {
  switch (S.ui.st) {
    case "down": return s.check_ok === 0;
    case "up": return s.check_ok === 1;
    case "na": return s.check_ok === -1;
    case "never": return s.check_ok === null || s.check_ok === undefined;
    case "off": return s.enabled === 0;
    default: return true;
  }
}
function checkDot(s) {
  const when = s.checked ? " · " + new Date(s.checked * 1000).toLocaleString() : "";
  if (s.check_ok === 1) return `<span class="dot up" title="Working (${esc(s.check_note)})${when}"></span>`;
  if (s.check_ok === 0) return `<span class="dot down" title="Down (${esc(s.check_note)})${when}"></span>`;
  if (s.check_ok === -1) return `<span class="dot na" title="Cannot be checked from Cloudflare (${esc(s.check_note)})"></span>`;
  return `<span class="dot" title="Not checked yet"></span>`;
}
/** The streams the current filters show (what "Check" checks). */
function visibleStreams() {
  const type = S.ui.type; const q = S.ui.q.toLowerCase();
  return (S.streams[S.list + ":" + type] || []).filter((s) => (!S.ui.cat || String(type === "episode" ? s.series_id : s.category_id) === S.ui.cat) && (!q || s.name.toLowerCase().includes(q) || String(s.id) === q) && stMatch(s));
}
async function setEnabled(ids, enabled) {
  for (let i = 0; i < ids.length; i += 5000) await API.post("streams-state", { ids: ids.slice(i, i + 5000), enabled });
  const on = enabled ? 1 : 0; const set = new Set(ids);
  Object.values(S.streams).forEach((rows) => rows.forEach((s) => { if (set.has(s.id)) s.enabled = on; }));
}
const CHECK_BATCH = 25, CHECK_PARALLEL = 8;
/** Runs the ids through POST /api/check, CHECK_PARALLEL requests at a time; onDone(results) after each request. */
async function runChecks(ids, onDone, stop) {
  const out = new Map(); let next = 0;
  const worker = async () => {
    while (next < ids.length && !stop.v) {
      const part = ids.slice(next, next + CHECK_BATCH); next += CHECK_BATCH;
      let res;
      try { res = await API.post("check", { ids: part }); } catch (e) { try { res = await API.post("check", { ids: part }); } catch (e2) { res = []; } }
      res.forEach((r) => out.set(r.id, r)); onDone(part.length);
    }
  };
  await Promise.all(Array.from({ length: CHECK_PARALLEL }, worker));
  return out;
}
function checkDialog(rows) {
  rows = rows.filter((s) => s.type !== "series");
  if (!rows.length) return;
  const stop = { v: false };
  Dlg.open(`Check ${rows.length} streams`, `
    <p class="small muted">Cloudflare opens each source, reads only the reply headers (no video) and closes it. Down streams are checked a second time before they count as down. Your own connection only carries the results.</p>
    <div style="margin-top:14px"><div class="row small muted"><span class="grow" id="c-msg">Checking…</span><span id="c-count">0 / ${rows.length}</span></div><div class="progress"><div id="c-bar"></div></div></div>
    <div class="check-stats"><div><span class="dot up"></span>Working<b id="c-up">0</b></div><div><span class="dot down"></span>Down<b id="c-down">0</b></div><div><span class="dot na"></span>Cannot check<b id="c-na">0</b></div></div>
    <div id="c-actions" style="margin-top:14px"></div>`,
    [{ label: "Close", cls: "ghost" }]);
  $("#dlg").addEventListener("close", () => { stop.v = true; render(); }, { once: true });
  const byId = new Map(rows.map((s) => [s.id, s]));
  const t0 = Date.now(); let done = 0;
  const counts = () => {
    const c = { up: 0, down: 0, na: 0 };
    rows.forEach((s) => { if (s._res === 1) c.up++; else if (s._res === 0) c.down++; else if (s._res === -1) c.na++; });
    $("#c-up").textContent = c.up; $("#c-down").textContent = c.down; $("#c-na").textContent = c.na;
  };
  const apply = (res) => res.forEach((r, id) => { const s = byId.get(id); if (s) { s._res = r.ok; s.check_ok = r.ok; s.check_note = r.note; s.checked = Math.floor(Date.now() / 1000); } });
  rows.forEach((s) => { delete s._res; });
  (async () => {
    const first = await runChecks(rows.map((s) => s.id), (n) => {
      done += n; if (stop.v) return;
      $("#c-bar").style.width = (100 * done / rows.length) + "%"; $("#c-count").textContent = `${done} / ${rows.length}`;
    }, stop);
    apply(first); if (stop.v) return; counts();
    const again = rows.filter((s) => s._res === 0).map((s) => s.id);
    if (again.length) {
      $("#c-msg").textContent = `Checking the ${again.length} down streams again…`;
      apply(await runChecks(again, () => {}, stop)); if (stop.v) return; counts();
    }
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    $("#c-msg").textContent = `Done in ${secs} s`; $("#c-bar").style.width = "100%";
    const downOn = rows.filter((s) => s._res === 0 && s.enabled !== 0).map((s) => s.id);
    const upOff = rows.filter((s) => s._res === 1 && s.enabled === 0).map((s) => s.id);
    const box = $("#c-actions");
    box.innerHTML = (downOn.length ? `<button type="button" class="danger" id="c-off">${icon("power")}Turn off ${downOn.length} down</button> ` : "")
      + (upOff.length ? `<button type="button" class="ghost" id="c-on">${icon("power")}Turn on ${upOff.length} working again</button>` : "")
      + (!downOn.length && !upOff.length ? `<p class="small muted">Nothing to change.</p>` : `<p class="small muted" style="margin-top:8px">Turned-off streams disappear from players but stay here; filter by "Turned off" to find them.</p>`);
    const act = (sel, ids, on) => { const b = $(sel); if (b) b.onclick = async () => {
      b.disabled = true;
      try { await setEnabled(ids, on); await Data.lists(); fillListSelect(); toast(`${ids.length} streams turned ${on ? "on" : "off"}`, "ok"); b.remove(); } catch (e) { fail(e); b.disabled = false; }
    }; };
    act("#c-off", downOn, false); act("#c-on", upOff, true);
  })().catch(fail);
}

// ---- M3U import
function parseM3u(text) {
  const out = []; let cur = null;
  for (let line of text.split(/\r?\n/)) {
    line = line.trim(); if (!line) continue;
    if (line.startsWith("#EXTINF")) {
      const attr = (k) => { const m = line.match(new RegExp(k + '="([^"]*)"', "i")); return m ? m[1].trim() : ""; };
      const lastQ = line.lastIndexOf('"'); const comma = line.indexOf(",", lastQ > 0 ? lastQ : 0);
      cur = { name: (comma >= 0 ? line.slice(comma + 1) : "").trim() || attr("tvg-name") || "Unknown", logo: attr("tvg-logo"), group: attr("group-title"), epg: attr("tvg-id") };
    } else if (line.startsWith("#EXTGRP:") && cur) cur.group = cur.group || line.slice(8).trim();
    else if (!line.startsWith("#") && cur) { if (/^(https?|rtmp|rtsp|udp):\/\//i.test(line)) out.push({ ...cur, url: line }); cur = null; }
  }
  return out;
}
const guessType = (i) => { const p = i.url.split("?")[0].toLowerCase(); return /\/movie\//.test(p) || /\.(mp4|mkv|avi|mov)$/.test(p) ? "vod" : "live"; };
function importM3u() {
  Dlg.open(`Import M3U into ${curList().name}`, `
    <div class="cols">
      <div class="field"><label class="f" for="m-type">Import as</label><select id="m-type"><option value="auto">Guess (movies by file type)</option><option value="live">Live TV</option><option value="vod">Movies</option></select></div>
      <div class="field"><label class="f" for="m-groups">Categories</label><select id="m-groups"><option value="group">From group-title (created when missing)</option><option value="none">Uncategorized</option></select></div>
    </div>
    <div class="field"><label class="f" for="m-file">M3U file</label><input id="m-file" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,text/plain"></div>
    <div class="field"><label class="f" for="m-text">or paste the playlist</label><textarea id="m-text" rows="8" class="mono" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;...&quot; group-title=&quot;News&quot;,Channel&#10;https://example.com/live.m3u8"></textarea></div>
    <label class="row small"><input type="checkbox" id="m-skip" checked> Skip addresses that are already in this list</label>
    <div id="m-prog" hidden style="margin-top:14px"><div class="row small muted"><span class="grow" id="m-msg">Importing…</span><span id="m-count"></span></div><div class="progress"><div id="m-bar"></div></div></div>`,
    [{ label: "Cancel", cls: "ghost" }, { label: `${icon("upload")}Import`, onClick: async () => {
      let text = $("#m-text").value; const f = $("#m-file").files[0];
      if (f) text = await f.text();
      const seen = new Set();
      const mode = $("#m-type").value;
      const items = parseM3u(text || "").filter((i) => !seen.has(i.url) && seen.add(i.url)).map((i) => ({ ...i, type: mode === "auto" ? guessType(i) : mode }));
      if (!items.length) { toast("No streams found in this playlist", "err"); return true; }
      $("#m-prog").hidden = false;
      let added = 0, cats = 0;
      for (let i = 0; i < items.length; i += 500) {
        const r = await API.post("import", { list_id: S.list, items: items.slice(i, i + 500), groups: $("#m-groups").value === "group", skip: $("#m-skip").checked });
        added += r.added; cats += r.cats;
        const done = Math.min(items.length, i + 500);
        $("#m-bar").style.width = (100 * done / items.length) + "%"; $("#m-count").textContent = `${done} / ${items.length}`;
      }
      await Data.changed(["live", "vod"]);
      toast(`Imported ${added} streams${cats ? ` and ${cats} categories` : ""}`, "ok"); render();
    } }]);
}

    <p class="small">Worker: <span class="mono">${esc(API.base())}</span></p>
    <p class="muted small">Players see a change made here at once (lists are cached by version on the server).</p>
    <button class="ghost" id="st-reload">${icon("refresh")}Reload everything</button>
  </div>`;
};
Views.settings.bind = () => {
  $("#st-save").onclick = async () => {
    try { await API.put("settings", { base_url: $("#st-base").value.trim() }); await Data.settings(); toast("Saved", "ok"); } catch (e) { fail(e); }
  };
  $("#st-reload").onclick = async () => { S.users = null; S.cats = {}; S.streams = {}; await Data.lists(); fillListSelect(); render(); };
  $("#st-add-admin").onclick = () => Dlg.open("Add an admin", `
    <div class="field"><label class="f" for="a-email">Email</label><input id="a-email" type="email" required></div>
    <div class="field"><label class="f" for="a-pass">Password (8+ characters)</label><input id="a-pass" class="mono" required minlength="8" value="${randPass()}"></div>`,
    [{ label: "Cancel", cls: "ghost" }, { label: "Add", onClick: async () => { await API.post("admins", { email: $("#a-email").value, password: $("#a-pass").value }); toast("Admin added", "ok"); render(); } }]);
  $("#st-pass").onclick = () => Dlg.open("Change my password", `
    <div class="field"><label class="f" for="p-old">Current password</label><input id="p-old" type="password" required autocomplete="current-password"></div>
    <div class="field"><label class="f" for="p-new">New password (8+ characters)</label><input id="p-new" type="password" required minlength="8" autocomplete="new-password"></div>`,
    [{ label: "Cancel", cls: "ghost" }, { label: "Change", onClick: async () => { await API.post("password", { old: $("#p-old").value, new: $("#p-new").value }); toast("Password changed; other devices are signed out", "ok"); } }]);
  document.querySelectorAll("[data-del-admin]").forEach((b) => b.onclick = async () => { try { await API.del("admins/" + b.dataset.delAdmin); toast("Removed", "ok"); render(); } catch (e) { fail(e); } });
};

// ---- football API keys (used by /footballRequest, /footballRecommendations; tried in order, next one on errors)
const FB_PROVIDERS = {
  apisports: { name: "API-Sports (direct)", url: "https://v3.football.api-sports.io", host: "v3.football.api-sports.io" },
  rapidapi: { name: "RapidAPI", url: "https://api-football-v1.p.rapidapi.com/v3", host: "api-football-v1.p.rapidapi.com" },
  custom: { name: "Other address", url: "", host: "" }
};
const fbProvider = (k) => Object.keys(FB_PROVIDERS).find((p) => p !== "custom" && FB_PROVIDERS[p].url === k.url) || "custom";
const maskKey = (k) => k.length > 8 ? k.slice(0, 4) + "••••" + k.slice(-4) : "••••";
function fbTestCell(k) {
  if (k.test_ok === null || k.test_ok === undefined) return '<span class="dot"></span><span class="muted small">Not tested</span>';
  const when = k.tested ? new Date(k.tested * 1000).toLocaleString() : "";
  return `<span class="dot ${k.test_ok ? "up" : "down"}"></span><span class="small" title="${esc(when)}">${esc(k.test_note || (k.test_ok ? "OK" : "Failed"))}</span>`;
}
Views.football = async () => {
  const { keys, fallback } = await API.get("football-keys");
  S.fkeys = keys; $("#n-fkeys").textContent = keys.length || "";
  const on = keys.filter((k) => k.enabled).length;
  return `
  <div class="head"><div class="grow"><h1>Football API</h1><p>Keys for the football endpoints. They are used in this order; when a key hits its limit or fails, the next one is used.</p></div>
    ${keys.length ? `<button class="ghost" id="fk-testall">${icon("pulse")}Test all</button>` : ""}
    <button id="fk-add">${icon("plus")}Add key</button></div>
  ${!keys.length && fallback ? `<div class="banner warn" style="margin-bottom:14px"><span class="grow">${fallback} keys come from the Worker secret FOOTBALL_KEYS. Copy them here to manage them.</span><button class="small" id="fk-import">Copy ${fallback} keys here</button></div>` : ""}
  ${keys.length && !on ? `<div class="banner err" style="margin-bottom:14px">No key is on: the football endpoints do not work.</div>` : ""}
  <div class="card flush">
    ${keys.length ? `<div class="tbl"><table><thead><tr><th class="num" style="width:40px">#</th><th>Key</th><th class="hide-sm">Provider</th><th>Last test</th><th class="num hide-sm">Calls</th><th></th></tr></thead><tbody>
    ${keys.map((k, i) => `<tr class="${k.enabled ? "" : "off"}">
      <td class="num muted">${i + 1}</td>
      <td><div class="name">${esc(k.label || "Key " + k.id)}${k.enabled ? "" : ' <span class="badge err">Off</span>'}</div><div class="sub mono">${esc(maskKey(k.key))}${k.note ? " · " + esc(k.note) : ""}</div></td>
      <td class="hide-sm"><div>${esc(FB_PROVIDERS[fbProvider(k)].name)}</div><div class="sub mono">${esc(k.host)}</div></td>
      <td id="fk-t-${k.id}">${fbTestCell(k)}</td>
      <td class="num hide-sm" title="${k.last_used ? "Last: " + esc(new Date(k.last_used * 1000).toLocaleString()) : ""}">${k.used || 0}</td>
      <td class="act">
        <button class="ghost small" data-fk-test="${k.id}">${icon("pulse")}Test</button>
        <button class="icon" title="Move up" aria-label="Move up" data-fk-up="${k.id}" ${i ? "" : "disabled"}>▲</button>
        <button class="icon" title="${k.enabled ? "Turn off" : "Turn on"}" aria-label="${k.enabled ? "Turn off" : "Turn on"}" data-fk-toggle="${k.id}">${icon("power")}</button>
        <button class="icon" title="Edit" aria-label="Edit" data-fk-edit="${k.id}">${icon("edit")}</button>
        <button class="icon" title="Delete" aria-label="Delete" data-fk-del="${k.id}">${icon("trash")}</button></td>
    </tr>`).join("")}</tbody></table></div>` : `<div class="empty">No keys yet. Add your API-Sports or RapidAPI key.</div>`}
  </div>
  <p class="small muted" style="margin-top:10px">Test asks the provider's /status (does not count against your daily requests): plan, requests used today / daily limit. "Calls" = requests made through this server.</p>`;
};
Views.football.bind = () => {
  const find = (id) => S.fkeys.find((k) => String(k.id) === String(id));
  const body = (k, extra) => ({ label: k.label, url: k.url, host: k.host, key: k.key, note: k.note, enabled: !!k.enabled, ord: k.ord, ...extra });
  $("#fk-add").onclick = () => editFootballKey();
  const imp = $("#fk-import"); if (imp) imp.onclick = async () => { try { const r = await API.post("football-keys/import-secret"); toast(`${r.added} keys copied`, "ok"); render(); } catch (e) { fail(e); } };
  const all = $("#fk-testall"); if (all) all.onclick = async () => {
    all.disabled = true;
    try { const r = await API.post("football-keys/test-all"); const bad = r.filter((x) => !x.ok).length; toast(bad ? `${bad} of ${r.length} keys failed` : `All ${r.length} keys work`, bad ? "err" : "ok"); render(); } catch (e) { fail(e); all.disabled = false; }
  };
  document.querySelectorAll("[data-fk-test]").forEach((b) => b.onclick = async () => {
    b.disabled = true; $("#fk-t-" + b.dataset.fkTest).innerHTML = '<span class="muted small">Testing…</span>';
    try { const r = await API.post(`football-keys/${b.dataset.fkTest}/test`); const k = find(r.id); Object.assign(k, { test_ok: r.ok, test_note: r.note, tested: Math.floor(Date.now() / 1000) }); $("#fk-t-" + k.id).innerHTML = fbTestCell(k); }
    catch (e) { fail(e); } finally { b.disabled = false; }
  });
  document.querySelectorAll("[data-fk-toggle]").forEach((b) => b.onclick = async () => {
    const k = find(b.dataset.fkToggle); b.disabled = true;
    try { await API.put("football-keys/" + k.id, body(k, { enabled: !k.enabled })); toast(k.enabled ? "Key turned off" : "Key turned on", "ok"); render(); } catch (e) { fail(e); b.disabled = false; }
  });
  document.querySelectorAll("[data-fk-up]").forEach((b) => b.onclick = async () => {
    const i = S.fkeys.findIndex((k) => String(k.id) === b.dataset.fkUp); if (i < 1) return;
    const order = S.fkeys.slice(); [order[i - 1], order[i]] = [order[i], order[i - 1]];
    b.disabled = true;
    try { await Promise.all(order.map((k, n) => k.ord === n ? null : API.put("football-keys/" + k.id, body(k, { ord: n })))); render(); } catch (e) { fail(e); b.disabled = false; }
  });
  document.querySelectorAll("[data-fk-edit]").forEach((b) => b.onclick = () => editFootballKey(find(b.dataset.fkEdit)));
  document.querySelectorAll("[data-fk-del]").forEach((b) => b.onclick = () => {
    const k = find(b.dataset.fkDel);
    Dlg.open("Delete key", `<p>Delete <b>${esc(k.label || "Key " + k.id)}</b> (<span class="mono">${esc(maskKey(k.key))}</span>)? This cannot be undone.</p>`, [{ label: "Cancel", cls: "ghost" }, { label: "Delete", cls: "danger", onClick: async () => {
      await API.del("football-keys/" + k.id); toast("Key deleted", "ok"); render();
    } }]);
  });
};
function editFootballKey(k) {
  const isNew = !k; const prov = k ? fbProvider(k) : "apisports";
  Dlg.open(isNew ? "Add football API key" : "Edit football API key", `
    <div class="cols">
      <div class="field"><label class="f" for="fk-label">Name (only for you)</label><input id="fk-label" maxlength="60" value="${esc(k ? k.label : "")}" placeholder="Free account 1"></div>
      <div class="field"><label class="f" for="fk-prov">Provider</label><select id="fk-prov">${Object.entries(FB_PROVIDERS).map(([id, p]) => `<option value="${id}" ${id === prov ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label class="f" for="fk-key">API key</label><input id="fk-key" class="mono" required maxlength="200" autocomplete="off" spellcheck="false" value="${esc(k ? k.key : "")}"></div>
    <div id="fk-custom" ${prov === "custom" ? "" : "hidden"}>
      <div class="field"><label class="f" for="fk-url">API address</label><input id="fk-url" class="mono" type="url" value="${esc(k ? k.url : FB_PROVIDERS[prov].url)}" placeholder="https://v3.football.api-sports.io"></div>
      <div class="field"><label class="f" for="fk-host">Host header (x-rapidapi-host)</label><input id="fk-host" class="mono" value="${esc(k ? k.host : FB_PROVIDERS[prov].host)}"></div>
    </div>
    <div class="field"><label class="f" for="fk-note">Note</label><input id="fk-note" maxlength="200" value="${esc(k ? k.note || "" : "")}"></div>
    <label class="row small"><input type="checkbox" id="fk-on" ${!k || k.enabled ? "checked" : ""}> On (used by the football endpoints)</label>
    <div class="row" style="margin-top:14px"><button type="button" class="ghost small" id="fk-try">${icon("pulse")}Test this key</button><span class="small" id="fk-res"></span></div>`,
    [{ label: "Cancel", cls: "ghost" }, { label: isNew ? "Add key" : "Save", onClick: async () => {
      const d = read();
      if (!d.url) { toast("Enter the API address", "err"); return true; }
      if (isNew) await API.post("football-keys", d); else await API.put("football-keys/" + k.id, { ...d, ord: k.ord });
      toast(isNew ? "Key added" : "Key saved", "ok"); render();
    } }]);
  const read = () => {
    const p = $("#fk-prov").value; const custom = p === "custom";
    return { label: $("#fk-label").value.trim(), key: $("#fk-key").value.trim(), note: $("#fk-note").value.trim(), enabled: $("#fk-on").checked,
      url: custom ? $("#fk-url").value.trim() : FB_PROVIDERS[p].url, host: custom ? $("#fk-host").value.trim() : FB_PROVIDERS[p].host };
  };
  $("#fk-prov").onchange = () => {
    const p = $("#fk-prov").value; $("#fk-custom").hidden = p !== "custom";
    if (p !== "custom") { $("#fk-url").value = FB_PROVIDERS[p].url; $("#fk-host").value = FB_PROVIDERS[p].host; }
  };
  $("#fk-try").onclick = async () => {
    const d = read(); if (!d.key) { $("#fk-key").reportValidity(); return; }
    const b = $("#fk-try"); b.disabled = true; $("#fk-res").innerHTML = '<span class="muted">Testing…</span>';
    try { const r = await API.post("football-keys/test", d); $("#fk-res").innerHTML = `<span class="dot ${r.ok ? "up" : "down"}"></span>${esc(r.note)}`; }
    catch (e) { $("#fk-res").textContent = e.message; } finally { b.disabled = false; }
  };
}

// ---------------------------------------------------------------- shell
let searchTimer = 0;
function bindSearch() {
  const q = $("#q"); if (!q) return;
  q.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.ui.q = q.value; S.ui.shown = PAGE; const pos = q.selectionStart; render().then(() => { const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }, 180); };
}
function setList(id) { S.list = id; store.set("xa_list", id); S.ui.cat = ""; S.ui.shown = PAGE; S.ui.linkUser = ""; fillListSelect(); }
function fillListSelect() {
  $("#list-select").innerHTML = S.lists.map((l) => `<option value="${esc(l.id)}" ${l.id === S.list ? "selected" : ""}>${esc(l.name)}${l.enabled ? "" : " (off)"}</option>`).join("");
  $("#n-lists").textContent = S.lists.length;
  const l = curList();
  $("#n-streams").textContent = l.live !== undefined ? l.live + l.vod + l.series : "";
  $("#n-cats").textContent = l.cats ?? "";
  $("#n-users").textContent = l.users ?? "";
}
function go(p) { if (location.hash !== "#" + p) location.hash = p; else render(); }
let renderId = 0;
async function render() {
  const id = ++renderId;
  let page = (location.hash.slice(1) || "streams").split("/")[0];
  if (!Views[page]) page = "streams";
  document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("on", a.dataset.page === page));
  const view = $("#view");
  if (!view.innerHTML) view.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const html = await Views[page]();
    if (id !== renderId) return;
    view.innerHTML = html; Views[page].bind && Views[page].bind(); fillListSelect();
  } catch (e) {
    if (id !== renderId) return;
    view.innerHTML = `<div class="banner err">${esc(e.message || e)}</div>`; console.error(e);
  }
}

// ---------------------------------------------------------------- sign-in
let setupMode = false;
function showLogin(msg) {
  $("#app").hidden = true; $("#login").hidden = false; $("#view").innerHTML = "";
  $("#api").value = API.base();
  if (msg) $("#login-err").textContent = msg;
  checkSetup();
}
async function checkSetup() {
  if (!API.base()) return;
  try {
    const r = await fetch(API.base() + "/api/status").then((x) => x.json());
    setupMode = !r.hasAdmin;
    $("#f-key").hidden = !setupMode; $("#setup-key").required = setupMode;
    $("#login-title").textContent = setupMode ? "Create the first admin" : "Stream Lists";
    $("#login-sub").textContent = setupMode ? "No admin yet: enter the setup key you set on the Worker, then your email and a password." : "Sign in with your admin account.";
    $("#login-btn").textContent = setupMode ? "Create admin" : "Sign in";
    $("#password").autocomplete = setupMode ? "new-password" : "current-password";
  } catch (e) { $("#login-err").textContent = "Cannot reach " + API.base(); }
}
$("#api").addEventListener("change", () => { store.set("xa_api", $("#api").value.trim().replace(/\/+$/, "")); $("#login-err").textContent = ""; checkSetup(); });
$("#login-form").onsubmit = async (e) => {
  e.preventDefault(); const btn = $("#login-btn"); const label = btn.textContent; btn.disabled = true; $("#login-err").textContent = "";
  store.set("xa_api", $("#api").value.trim().replace(/\/+$/, ""));
  try {
    const body = { email: $("#email").value.trim(), password: $("#password").value };
    const r = setupMode ? await API.post("setup", { ...body, key: $("#setup-key").value }) : await API.post("login", body);
    store.set("xa_token", r.token); await start();
  } catch (err) { $("#login-err").textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = label; }
};
async function start() {
  if (!API.base() || !API.token()) return showLogin();
  try { S.email = (await API.get("me")).email; } catch (e) { return showLogin(e.message === "Sign in again" ? "" : e.message); }
  $("#login").hidden = true; $("#app").hidden = false; $("#who").textContent = S.email;
  try { await Promise.all([Data.lists(), Data.settings()]); } catch (e) { fail(e); }
  fillListSelect(); render();
}
window.addEventListener("hashchange", () => { S.ui.q = ""; S.ui.shown = PAGE; render(); });
$("#list-select").onchange = (e) => { setList(e.target.value); render(); };
$("#btn-out").onclick = async () => { try { await API.post("logout"); } catch (e) {} store.set("xa_token", null); showLogin(); };
start();
</script>
</body>
</html>
