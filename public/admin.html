<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stream Lists Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='13' rx='2' fill='%237c6cff'/%3E%3Cpath d='M10 8l5 2.5-5 2.5z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://www.gstatic.com">
<style>
:root {
  --bg: #0d1117; --side: #11161e; --panel: #161c26; --panel-2: #1d2532; --hover: #222b3a; --line: #263041;
  --text: #e8edf4; --text-2: #9aa7b8; --text-3: #6b7889; --accent: #7c6cff; --accent-2: #9a8cff;
  --ok: #2fbf71; --warn: #f0a33a; --err: #f0525a; --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent-2); text-decoration: none; }
a:hover { text-decoration: underline; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; background: var(--accent); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
button:hover { filter: brightness(1.1); }
button:disabled { opacity: .5; cursor: default; filter: none; }
button.ghost { background: var(--panel-2); border-color: var(--line); color: var(--text); font-weight: 500; }
button.ghost:hover { background: var(--hover); }
button.danger { background: transparent; border-color: rgba(240,82,90,.4); color: var(--err); }
button.danger:hover { background: rgba(240,82,90,.12); }
button.icon { padding: 6px; background: transparent; color: var(--text-2); }
button.icon:hover { background: var(--hover); color: var(--text); }
button.small { padding: 5px 10px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(124,108,255,.18); }
input[type=checkbox] { width: auto; accent-color: var(--accent); }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 5px; }
.field { margin-bottom: 14px; }
.row { display: flex; gap: 12px; align-items: center; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
[hidden] { display: none !important; }

/* login */
#login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
.login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
.login-card h1 { margin: 14px 0 4px; font-size: 20px; }
.logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); display: grid; place-items: center; color: #fff; }
.logo svg.i { width: 24px; height: 24px; }

/* shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.tbl { overflow-x: auto; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; gap: 14px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand .logo { width: 34px; height: 34px; border-radius: 9px; }
.brand b { display: block; font-size: 14.5px; } .brand span { font-size: 12px; color: var(--text-3); }
.list-pick label { padding: 0 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; margin-bottom: 2px; border-radius: 8px; color: var(--text-2); position: relative; }
.nav a:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.nav a.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
.nav a.on::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--text-3); }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 6px 0; }
.side-foot .who { display: block; font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 8px; }
main { min-width: 0; padding: 26px 32px 60px; }
.head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 22px; } .head p { margin: 3px 0 0; color: var(--text-2); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.card h2 { margin: 0 0 12px; font-size: 15px; }
.card.flush { padding: 0; overflow: hidden; }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--radius); background: rgba(240,163,58,.1); border: 1px solid rgba(240,163,58,.35); margin-bottom: 16px; flex-wrap: wrap; }
.banner.err { background: rgba(240,82,90,.1); border-color: rgba(240,82,90,.35); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.toolbar input, .toolbar select { width: auto; min-width: 160px; }
.toolbar input[type=search] { flex: 1; min-width: 180px; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.tabs button { background: transparent; color: var(--text-2); font-weight: 500; padding: 6px 12px; }
.tabs button.on { background: var(--panel-2); color: var(--text); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: rgba(255,255,255,.015); }
td.num, th.num { text-align: right; } td.act { text-align: right; white-space: nowrap; }
td .name { font-weight: 600; } td .sub { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
.thumb { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; background: var(--panel-2); display: block; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--panel-2); color: var(--text-2); }
.badge.ok { background: rgba(47,191,113,.14); color: var(--ok); }
.badge.err { background: rgba(240,82,90,.14); color: var(--err); }
.badge.warn { background: rgba(240,163,58,.14); color: var(--warn); }
.badge.acc { background: rgba(124,108,255,.16); color: var(--accent-2); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.empty { padding: 48px 16px; text-align: center; color: var(--text-3); }
.more { padding: 12px; text-align: center; border-top: 1px solid var(--line); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile b { display: block; font-size: 24px; } .tile span { color: var(--text-2); font-size: 12.5px; }
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.list-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.list-card.on { border-color: var(--accent); }
.list-card h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.list-card .stats { display: flex; gap: 14px; color: var(--text-2); font-size: 12.5px; flex-wrap: wrap; }
.copy { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 10px; margin-bottom: 10px; }
.copy code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.copy-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin: 0 0 5px; }
pre.share { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; margin: 0 0 10px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.checks label:has(input:checked) { border-color: var(--accent); background: rgba(124,108,255,.08); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.progress { height: 6px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
.progress div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; width: min(620px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog form { display: flex; flex-direction: column; max-height: calc(100vh - 34px); }
.dlg-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.dlg-head h3 { margin: 0; font-size: 16px; flex: 1; }
.dlg-body { padding: 18px 20px; overflow: auto; }
.dlg-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dlg-foot .left { margin-right: auto; }

/* toasts */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; min-width: 240px; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,.35); animation: rise .2s ease-out; }
.toast.ok { border-left-color: var(--ok); } .toast.err { border-left-color: var(--err); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; min-width: 0; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 10px; }
  .brand span { display: none; }
  .list-pick { flex: 1; min-width: 0; } .list-pick label { display: none; }
  .toolbar input, .toolbar select { min-width: 0; flex: 1 1 140px; }
  .toolbar .tabs { overflow-x: auto; max-width: 100%; }
  .nav { order: 5; width: 100%; display: flex; overflow-x: auto; gap: 2px; }
  .nav a { white-space: nowrap; padding: 8px 10px; } .nav a.on::before { display: none; }
  .side-foot { margin: 0; border: 0; padding: 0; } .side-foot .who { display: none; }
  main { padding: 18px 16px 48px; }
  .hide-sm { display: none; }
  td, th { padding: 8px 10px; }
}
</style>
</head>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="login-card" id="login-form">
    <div class="logo"><svg class="i"><use href="#i-tv"/></svg></div>
    <h1>Stream Lists Admin</h1>
    <p class="muted" style="margin:0 0 20px">Sign in with your admin account.</p>

<!-- APP -->

  <aside class="side">
    <div class="brand"><div class="logo"><svg class="i"><use href="#i-tv"/></svg></div><div><b>Stream Lists</b><span>Xtream admin</span></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";

  setDoc, updateDoc, deleteDoc, writeBatch, runTransaction, increment, serverTimestamp, getCountFromServer
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyClgzoMBEKizx-r7abMvAmLgGpk_p748IU",
  authDomain: "iptv-8b60c.firebaseapp.com",
  projectId: "iptv-8b60c",
  storageBucket: "iptv-8b60c.firebasestorage.app",
  messagingSenderId: "259048691910",
  appId: "1:259048691910:web:b57f9eeda5546ce4d8dfc7"
};
// Local testing (`firebase emulators:start --project demo-iptv`) serves this page on localhost: it then uses the
// emulators of the demo project and can never touch the real database.
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
const app = initializeApp(LOCAL ? { ...firebaseConfig, projectId: "demo-iptv" } : firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

  connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });

}

const C = { lists: "xtream_lists", users: "xtream_users", cats: "xtream_categories", streams: "xtream_streams", meta: "xtream_meta" };
const DEFAULT_LIST = "default";

// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;
const nowSec = () => Math.floor(Date.now() / 1000);
const toast = (msg, kind = "") => {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg; el.setAttribute("role", kind === "err" ? "alert" : "status");
  $("#toasts").appendChild(el); setTimeout(() => el.remove(), kind === "err" ? 6000 : 3000);
};
const fail = (e) => { console.error(e); toast(e.code === "permission-denied" ? "Not allowed: this account is not an admin (see Settings)." : (e.message || String(e)), "err"); };
const slug = (s) => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
const LIST_ID_RE = /^[a-z0-9][a-z0-9_-]{0,39}$/;
const fmtDate = (sec) => sec ? new Date(sec * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const randPass = () => { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; const r = crypto.getRandomValues(new Uint32Array(10)); for (const n of r) s += a[n % a.length]; return s; };
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Copied", "ok"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copied", "ok"); }
}
async function chunked(ops) { // ops: [(batch) => void], 400 writes per batch
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db); ops.slice(i, i + 400).forEach((f) => f(b)); await b.commit();
  }
}

// ---------------------------------------------------------------- state
const S = {

  ui: { type: store.get("xa_type", "live"), cat: "", q: "", shown: PAGE, allUsers: store.get("xa_all", "0") === "1", catType: "live", linkUser: "" }
};

// ---------------------------------------------------------------- data
const Data = {
  async lists() {
    const snap = await getDocs(collection(db, C.lists));
    S.lists = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.id === DEFAULT_LIST ? -1 : b.id === DEFAULT_LIST ? 1 : String(a.name).localeCompare(String(b.name))));
    if (!S.lists.length) S.lists = [{ id: DEFAULT_LIST, name: "Default", virtual: true }];
    if (!S.lists.some((l) => l.id === S.list)) S.list = S.lists[0].id;
  },
  async users(force) {
    if (S.users && !force) return S.users;
    const snap = await getDocs(collection(db, C.users));
    S.users = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.username).localeCompare(String(b.username)));
    return S.users;
  },
  async cats(listId = S.list, force) {
    if (S.cats[listId] && !force) return S.cats[listId];
    const snap = await getDocs(query(collection(db, C.cats), where("list_id", "==", listId)));
    S.cats[listId] = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.category_name).localeCompare(String(b.category_name)));
    return S.cats[listId];
  },
  async streams(type, listId = S.list, force) {
    const key = listId + ":" + type;
    if (S.streams[key] && !force) return S.streams[key];
    const snap = await getDocs(query(collection(db, C.streams), where("list_id", "==", listId), where("type", "==", type)));
    S.streams[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (Number(a.num) || 0) - (Number(b.num) || 0) || String(a.name).localeCompare(String(b.name)));
    return S.streams[key];
  },
  /** Counts without reading the documents (1 read per 1000). */
  async counts(listId = S.list) {
    const n = async (coll, t) => (await getCountFromServer(query(collection(db, coll), where("list_id", "==", listId), where("type", "==", t)))).data().count;
    const [live, vod, series, cl, cv, cs] = await Promise.all([n(C.streams, "live"), n(C.streams, "vod"), n(C.streams, "series"), n(C.cats, "live"), n(C.cats, "vod"), n(C.cats, "series")]);
    return (S.counts[listId] = { live, vod, series, streams: live + vod + series, cats: cl + cv + cs });
  },
  async settings() {
    const s = await getDoc(doc(db, C.meta, "settings"));
    S.settings = s.exists() ? s.data() : {};
  },
  /** The server keeps lists in memory until the list's rev changes: bump it after every change. */
  touch(listId = S.list) {
    return setDoc(doc(db, C.lists, listId), { rev: increment(1), updated: serverTimestamp() }, { merge: true })
      .then(() => { const l = S.lists.find((x) => x.id === listId); if (l) delete l.virtual; return Data.counts(listId); }).then(counts, () => {});
  },
  /** Reserves n unique ids (shared by streams of every list and type). */
  async ids(kind, n) {
    const ref = doc(db, C.meta, "counters");
    let start = 0;
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      let next = snap.exists() ? Number(snap.data()[kind]) || 0 : 0;
      if (!next) next = await Data.maxId(kind) + 1;
      start = next;
      tx.set(ref, { [kind]: next + n }, { merge: true });
    });
    return start;
  },
  async maxId(kind) {
    if (kind === "stream_id") {
      const s = await getDocs(query(collection(db, C.streams), orderBy("stream_id", "desc"), limit(1)));
      return s.empty ? 1000 : Math.max(1000, Number(s.docs[0].data().stream_id) || 0);
    }
    const s = await getDocs(collection(db, C.cats));
    return s.docs.reduce((m, d) => Math.max(m, Number(d.data().category_id) || 0), 0);
  },
  async checkMigration() {
    const m = await getDoc(doc(db, C.meta, "migration"));
    if (m.exists() && m.data().lists_v1) { S.needsMigration = false; return; }
    // Old data has no list_id: look for one stream / category / user without it.
    const [st, ca] = await Promise.all([getDocs(query(collection(db, C.streams), limit(50))), getDocs(query(collection(db, C.cats), limit(50)))]);
    const users = await Data.users();
    S.needsMigration = st.docs.some((d) => !d.data().list_id) || ca.docs.some((d) => !d.data().list_id) || users.some((u) => !Array.isArray(u.lists));
    if (!S.needsMigration) await setDoc(doc(db, C.meta, "migration"), { lists_v1: true, at: serverTimestamp() }, { merge: true });
  },
  async migrate(onStep) {
    const ops = [];
    const [st, ca] = await Promise.all([getDocs(collection(db, C.streams)), getDocs(collection(db, C.cats))]);
    st.docs.forEach((d) => { if (!d.data().list_id) ops.push((b) => b.update(d.ref, { list_id: DEFAULT_LIST })); });
    ca.docs.forEach((d) => { if (!d.data().list_id) ops.push((b) => b.update(d.ref, { list_id: DEFAULT_LIST })); });
    (await Data.users(true)).forEach((u) => { if (!Array.isArray(u.lists)) ops.push((b) => b.update(doc(db, C.users, u.id), { lists: [DEFAULT_LIST] })); });
    onStep && onStep(ops.length);
    await chunked(ops);
    await setDoc(doc(db, C.lists, DEFAULT_LIST), { name: "Default", enabled: true, rev: increment(1), created: serverTimestamp() }, { merge: true });
    await setDoc(doc(db, C.meta, "migration"), { lists_v1: true, at: serverTimestamp() }, { merge: true });
    S.needsMigration = false; S.cats = {}; S.streams = {}; S.users = null;
    return ops.length;
  }
};

const Dlg = {
  gen: 0,

    const gen = ++Dlg.gen;
    $("#dlg-title").textContent = title;
    $("#dlg-body").innerHTML = body;
    const foot = $("#dlg-foot"); foot.innerHTML = "";
    (buttons || [{ label: "Close", cls: "ghost" }]).forEach((b) => {

      el.type = "button"; el.className = (b.cls || "") + (b.left ? " left" : "");
      el.innerHTML = b.label; if (b.id) el.id = b.id;
      if (!b.onClick) el.onclick = () => $("#dlg").close();
      else el.dataset.primary = "1";
      if (b.onClick) el.onclick = async () => {
        if (b.validate !== false && !$("#dlg-form").reportValidity()) return;
        el.disabled = true;
        try { const keep = await b.onClick(); if (keep !== true && gen === Dlg.gen) $("#dlg").close(); } catch (e) { fail(e); } finally { el.disabled = false; }
      };
      foot.appendChild(el);
    });
    if (!$("#dlg").open) $("#dlg").showModal();

async function deleteList(id) {
  const l = S.lists.find((x) => x.id === id); if (!l) return;
  const [cats, ...st] = await Promise.all([Data.cats(id), ...Object.keys(TYPES).map((t) => Data.streams(t, id))]);
  const n = st.reduce((a, b) => a + b.length, 0);
  Dlg.open("Delete list", `<p>This deletes the list <b>${esc(l.name)}</b>, its ${n} streams and ${cats.length} categories. Users keep their accounts but lose this list. This cannot be undone.</p>
    <div class="field"><label class="f" for="d-id">Type <span class="mono">${esc(id)}</span> to confirm</label><input id="d-id" class="mono" autocomplete="off"></div>`,
    [{ label: "Cancel", cls: "ghost" }, { label: `${icon("trash")}Delete everything`, cls: "danger", onClick: async () => {
      if ($("#d-id").value.trim() !== id) { toast("The name does not match", "err"); return true; }
      const ops = [];
      st.flat().forEach((s) => ops.push((b) => b.delete(doc(db, C.streams, s.id))));
      cats.forEach((c) => ops.push((b) => b.delete(doc(db, C.cats, c.id))));
      (await Data.users()).filter((u) => userLists(u).includes(id)).forEach((u) => ops.push((b) => b.update(doc(db, C.users, u.id), { lists: userLists(u).filter((x) => x !== id) })));
      ops.push((b) => b.delete(doc(db, C.lists, id)));
      await chunked(ops);
      S.users = null; delete S.cats[id]; Object.keys(TYPES).forEach((t) => delete S.streams[id + ":" + t]);
      await Data.lists(); setList(S.lists[0].id); toast("List deleted", "ok"); render();
    } }]);
}

// ---- M3U import
function parseM3u(text) {
  const out = []; let cur = null;
  for (let line of text.split(/\r?\n/)) {
    line = line.trim(); if (!line) continue;
    if (line.startsWith("#EXTINF")) {
      const attr = (k) => { const m = line.match(new RegExp(k + '="([^"]*)"', "i")); return m ? m[1].trim() : ""; };
      const comma = line.indexOf(",", line.lastIndexOf('"') > 0 ? line.lastIndexOf('"') : 0);
      cur = { name: (comma >= 0 ? line.slice(comma + 1) : "").trim() || attr("tvg-name") || "Unknown", logo: attr("tvg-logo"), group: attr("group-title"), epg: attr("tvg-id") };
    } else if (line.startsWith("#EXTGRP:") && cur) cur.group = cur.group || line.slice(8).trim();
    else if (!line.startsWith("#") && cur) { if (/^(https?|rtmp|rtsp|udp):\/\//i.test(line)) out.push({ ...cur, url: line }); cur = null; }
  }
  return out;
}
function guessType(item) {
  const p = item.url.split("?")[0].toLowerCase();
  if (/\/movie\//.test(p) || /\.(mp4|mkv|avi|mov)$/.test(p)) return "vod";
  return "live";
}
async function importM3u() {
  Dlg.open(`Import M3U into ${curList().name}`, `
    <div class="cols">
      <div class="field"><label class="f" for="m-type">Import as</label><select id="m-type"><option value="auto">Guess (movies by file type)</option><option value="live">Live TV</option><option value="vod">Movies</option></select></div>
      <div class="field"><label class="f" for="m-groups">Categories</label><select id="m-groups"><option value="group">From group-title (created when missing)</option><option value="none">Uncategorized</option></select></div>
    </div>
    <div class="field"><label class="f" for="m-file">M3U file</label><input id="m-file" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,text/plain"></div>
    <div class="field"><label class="f" for="m-text">or paste the playlist</label><textarea id="m-text" rows="8" class="mono" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;...&quot; group-title=&quot;News&quot;,Channel&#10;https://example.com/live.m3u8"></textarea></div>
    <label class="row small"><input type="checkbox" id="m-skip" checked> Skip addresses that are already in this list</label>
    <div id="m-prog" hidden style="margin-top:14px"><div class="row small muted"><span class="grow" id="m-msg">Importing…</span><span id="m-count"></span></div><div class="progress"><div id="m-bar"></div></div></div>`,
    [{ label: "Cancel", cls: "ghost" }, { label: `${icon("upload")}Import`, onClick: async () => {
      let text = $("#m-text").value; const f = $("#m-file").files[0];
      if (f) text = await f.text();
      const items = parseM3u(text || "");
      if (!items.length) { toast("No streams found in this playlist", "err"); return true; }
      $("#m-prog").hidden = false;
      const mode = $("#m-type").value, groups = $("#m-groups").value === "group";
      const cats = await Data.cats(S.list, true);
      const seen = new Set();
      if ($("#m-skip").checked) for (const t of ["live", "vod"]) (await Data.streams(t, S.list, true)).forEach((s) => seen.add(s.direct_source));
      const todo = items.filter((i) => !seen.has(i.url) && (seen.add(i.url), true));
      if (!todo.length) { $("#m-msg").textContent = "Everything is already in this list."; return true; }
      // categories first
      const catKey = (t, n) => t + "|" + n.toLowerCase();
      const catMap = new Map(cats.map((c) => [catKey(c.type, String(c.category_name)), c.category_id]));
      const needCats = [];
      todo.forEach((i) => { i.type = mode === "auto" ? guessType(i) : mode; if (groups && i.group && !catMap.has(catKey(i.type, i.group))) { catMap.set(catKey(i.type, i.group), null); needCats.push([i.type, i.group]); } });
      if (needCats.length) {
        let cid = await Data.ids("category_id", needCats.length);
        await chunked(needCats.map(([t, n]) => { const id = cid++; catMap.set(catKey(t, n), id); return (b) => b.set(doc(collection(db, C.cats)), { list_id: S.list, type: t, category_name: n, category_id: id, parent_id: 0 }); }));
      }
      let sid = await Data.ids("stream_id", todo.length);
      const now = String(nowSec()); let done = 0;
      for (let i = 0; i < todo.length; i += 400) {
        const b = writeBatch(db);
        todo.slice(i, i + 400).forEach((it, k) => {
          const ext = it.url.split("?")[0].split(".").pop().toLowerCase();
          b.set(doc(collection(db, C.streams)), {
            list_id: S.list, type: it.type, name: it.name, stream_icon: it.logo, direct_source: it.url, epg_channel_id: it.epg,
            category_id: groups && it.group ? catMap.get(catKey(it.type, it.group)) : 0, stream_id: sid++, num: i + k + 1, added: now, rating: "0",
            ...(it.type === "vod" && /^(mp4|mkv|avi|mov|webm|m3u8|ts)$/.test(ext) ? { container_extension: ext } : {})
          });
        });
        await b.commit(); done = Math.min(todo.length, i + 400);
        $("#m-bar").style.width = (100 * done / todo.length) + "%"; $("#m-count").textContent = `${done} / ${todo.length}`;
      }
      await Data.touch(); S.cats[S.list] = null; delete S.streams[S.list + ":live"]; delete S.streams[S.list + ":vod"];
      toast(`Imported ${todo.length} streams${needCats.length ? ` and ${needCats.length} categories` : ""}`, "ok"); render();
    } }]);
}

  </div>
  <div class="card"><h2>For one user</h2>
    ${users.length ? `<div class="field" style="max-width:360px"><label class="f" for="lu">User</label><select id="lu"><option value="">Choose a user</option>${users.map((u) => `<option value="${esc(u.id)}" ${pick && pick.id === u.id ? "selected" : ""}>${esc(u.username)}</option>`).join("")}</select></div>` : `<p class="muted">No user can watch this list yet. Create one in Users and tick ${esc(curList().name)}.</p>`}
    ${pick ? `${userState(pick)[1] ? "" : `<div class="banner err">${userState(pick)[0]}<span>These links will not work until this user is active again.</span></div>`}
      <div class="cols">${Links.row("Username", pick.username)}${Links.row("Password", pick.password)}</div>
      ${Links.row("M3U playlist", lu.m3u)}${Links.row("M3U playlist (HLS)", lu.m3u8)}${Links.row("API test (opens the account info)", lu.api)}
      <p class="copy-label">Message to send</p><pre class="share">${esc(Links.share(S.list, pick))}</pre>
      <button type="button" data-copy="${esc(Links.share(S.list, pick))}">${icon("copy")}Copy message</button>` : ""}
  </div>`;
};
Views.links.bind = () => { const s = $("#lu"); if (s) s.onchange = () => { S.ui.linkUser = s.value; render(); }; };

// ---- settings
Views.settings = async () => {
  await Data.settings();
  return `
  <div class="head"><div class="grow"><h1>Settings</h1></div></div>
  <div class="card"><h2>Public address</h2>
    <p class="muted small">The start of every link given to users. Leave it empty to use this page's address (${esc(location.origin)}). Use your own domain here once it points to Firebase Hosting.</p>
    <div class="row"><input id="st-base" class="mono grow" type="url" placeholder="${esc(location.origin)}" value="${esc(S.settings.base_url || "")}"><button id="st-save">Save</button></div>
  </div>
  <div class="card"><h2>Your admin account</h2>
    <p class="small">Signed in as <b>${esc(S.user.email || "")}</b>. UID: <span class="mono">${esc(S.user.uid)}</span> <button class="ghost small" data-copy="${esc(S.user.uid)}">${icon("copy")}Copy</button></p>
    <p class="muted small">With the rules in <span class="mono">firestore.rules</span>, only accounts with a document <span class="mono">xtream_admins/&lt;UID&gt;</span> (created by hand in the Firebase console) can open this page's data.</p>
  </div>
  <div class="card"><h2>Data</h2>
    <p class="muted small">The server keeps each list in memory and reads it again within 10 seconds of a change made here.</p>
    <button class="ghost" id="st-reload">${icon("refresh")}Reload everything</button>
  </div>`;
};
Views.settings.bind = () => {
  $("#st-save").onclick = async () => {
    const v = $("#st-base").value.trim().replace(/\/+$/, "");
    if (v && !/^https?:\/\/[^/]+$/.test(v)) { toast("Only the address, like https://tv.example.com", "err"); return; }
    try { await setDoc(doc(db, C.meta, "settings"), { base_url: v }, { merge: true }); S.settings.base_url = v; toast("Saved", "ok"); } catch (e) { fail(e); }
  };
  $("#st-reload").onclick = async () => { S.users = null; S.cats = {}; S.streams = {}; await Data.lists(); render(); };
};

// ---------------------------------------------------------------- shell
let page = "streams";
let searchTimer = 0;
function bindSearch() {
  const q = $("#q"); if (!q) return;
  q.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.ui.q = q.value; S.ui.shown = PAGE; const pos = q.selectionStart; render().then(() => { const n = $("#q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }); }, 180); };
}
function setList(id) { S.list = id; store.set("xa_list", id); S.ui.cat = ""; S.ui.shown = PAGE; S.ui.linkUser = ""; fillListSelect(); }
function fillListSelect() {
  $("#list-select").innerHTML = S.lists.map((l) => `<option value="${esc(l.id)}" ${l.id === S.list ? "selected" : ""}>${esc(l.name || l.id)}${l.enabled === false ? " (off)" : ""}</option>`).join("");
  $("#n-lists").textContent = S.lists.length;
}
function go(p) { if (location.hash !== "#" + p) location.hash = p; else render(); }
let renderId = 0;
async function render() {
  const id = ++renderId;
  page = (location.hash.slice(1) || "streams").split("/")[0];
  if (!Views[page]) page = "streams";
  document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("on", a.dataset.page === page));
  const view = $("#view");
  if (!view.innerHTML) view.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const html = await Views[page]();
    if (id !== renderId) return;
    view.innerHTML = html; Views[page].bind && Views[page].bind();
    renderBanners(); counts();
  } catch (e) {
    if (id !== renderId) return;
    view.innerHTML = `<div class="banner err">${e.code === "permission-denied" ? `This account cannot read the data. Ask for a document <span class="mono">xtream_admins/${esc(S.user && S.user.uid)}</span> in Firestore (see Settings).` : esc(e.message || e)}</div>`;
    console.error(e);
  }
}
function counts() {
  if (S.users) $("#n-users").textContent = S.users.filter((u) => userLists(u).includes(S.list)).length;
  const c = S.counts[S.list];
  $("#n-streams").textContent = c ? c.streams : ""; $("#n-cats").textContent = c ? c.cats : "";
}
function renderBanners() {
  const b = $("#banners");
  b.innerHTML = S.needsMigration ? `<div class="banner"><span class="grow"><b>One step after the update:</b> streams, categories and users from before lists existed must be moved into the <b>Default</b> list. Old links keep working after that.</span><button id="migrate">Move them now</button></div>` : "";
  const m = $("#migrate");
  if (m) m.onclick = async () => {
    m.disabled = true; m.textContent = "Moving…";
    try { const n = await Data.migrate(); await Data.lists(); fillListSelect(); toast(`Done: ${n} items moved into Default`, "ok"); render(); } catch (e) { fail(e); m.disabled = false; m.textContent = "Move them now"; }
  };
}
async function preload() {
  // counts in the side bar without waiting for a click
  try { await Promise.all([Data.users(), Data.counts()]); counts(); } catch (e) { /* shown by render */ }
}

window.addEventListener("hashchange", () => { S.ui.q = ""; S.ui.shown = PAGE; render(); });
$("#list-select").onchange = (e) => { setList(e.target.value); render(); preload(); };
$("#btn-out").onclick = () => signOut(auth);
$("#login-form").onsubmit = async (e) => {
  e.preventDefault(); const btn = $("#login-btn"); btn.disabled = true; btn.textContent = "Signing in…"; $("#login-err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#password").value); }
  catch (err) { $("#login-err").textContent = /invalid|wrong|not-found|credential/.test(err.code || "") ? "Wrong email or password." : (err.message || "Could not sign in."); }
  finally { btn.disabled = false; btn.textContent = "Sign in"; }
};

onAuthStateChanged(auth, async (user) => {
  S.user = user;
  $("#login").hidden = !!user; $("#app").hidden = !user;
  if (!user) { $("#view").innerHTML = ""; return; }
  $("#who").textContent = user.email || user.uid;
  try { await Promise.all([Data.lists(), Data.settings()]); await Data.checkMigration(); } catch (e) { console.error(e); }
  fillListSelect(); await render(); preload();
});
</script>
</body>
</html>
